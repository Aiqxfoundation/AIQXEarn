[toolchain]

[features]
resolution = true
skip-lint = false

[programs.mainnet]
aiqx_matrix = "AIQXmatr1x11111111111111111111111111111111"

[programs.localnet]
aiqx_matrix = "AIQXmatr1x11111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Mainnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
deploy-mainnet = "bash scripts/deploy-mainnet.sh"
